version: "3.9"

services:
  db:
    container_name: refresh_tokens_db
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always

  api:
    build: .
    container_name: "refresh_tokens_api"
    volumes: 
      - ./:/app
    ports: 
      - "8000:8000"
    restart: always
    depends_on:
      - db

volumes:
  postgres_data: